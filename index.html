<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekolah Minggu Bareng</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
body {
    background:linear-gradient(135deg,#1a237e,#3949ab,#5c6bc0);
    min-height:100vh; display:flex; justify-content:center;
    align-items:center; padding:20px;
}
.card {
    background:#fff; border-radius:24px; padding:35px 25px;
    max-width:400px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    position:relative; overflow:hidden;
}
.card::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:8px; background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);
}
.icon {
    font-size:70px; margin-bottom:10px;
    animation:float 2s infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
h1 {
    color:#1a237e; font-size:24px; font-weight:800;
    margin-bottom:8px; letter-spacing:0.5px;
}
.subtitle {
    color:#5c6bc0; font-size:13px; margin-bottom:25px;
}
.info-box {
    background:#f5f7ff; border-radius:16px; padding:20px;
    margin:20px 0; border:1.5px dashed #c5cae9;
}
.info-row {
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin:10px 0; font-size:15px; color:#3949ab;
    font-weight:600;
}
.info-row .emoji { font-size:20px; }
.divider {
    height:1px; background:#e0e4f5; margin:15px 0;
}
.btn-join {
    width:100%; padding:18px; border:none; border-radius:50px;
    background:linear-gradient(135deg,#4285f4,#1a73e8);
    color:#fff; font-size:18px; font-weight:800;
    cursor:pointer; letter-spacing:2px;
    box-shadow:0 6px 0 #0d47a1;
    transition:0.1s;
    margin-top:10px;
    text-transform:uppercase;
}
.btn-join:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 #0d47a1;
}
.btn-join:disabled {
    background:#ccc; box-shadow:0 6px 0 #999; cursor:wait;
}
.link-text {
    font-size:10px; color:#90a4ae; margin-top:15px;
    word-break:break-all;
}
.footer {
    font-size:10px; color:#b0bec5; margin-top:20px;
}
.pulse {
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#34a853; margin-right:6px;
    animation:pulse 1.5s infinite;
}
@keyframes pulse {
    0%,100%{opacity:1; transform:scale(1)}
    50%{opacity:0.5; transform:scale(1.3)}
}
.live-badge {
    display:inline-block; background:#e8f5e9; color:#2e7d32;
    padding:4px 12px; border-radius:20px; font-size:10px;
    font-weight:700; margin-bottom:10px;
}
</style>
</head>
<body>
<div class="card">
    <div class="icon">📖</div>
    <div class="live-badge"><span class="pulse"></span>LIVE MEETING</div>
    <h1>Sekolah Minggu Bareng</h1>
    <div class="subtitle">Yuk gabung ibadah bersama kami! 🙏</div>

    <div class="info-box">
        <div class="info-row">
            <span class="emoji">🕐</span>
            <span>Pukul 11:00 - 12:00</span>
        </div>
        <div class="divider"></div>
        <div class="info-row">
            <span class="emoji">📅</span>
            <span>Tanggal 14 Oktober</span>
        </div>
    </div>

    <button class="btn-join" id="joinBtn" onclick="joinMeet()">🎥 JOIN</button>

    <div class="link-text">meet.google.com/tqf-jfbz-ecu</div>
    <div class="footer">Google Meet • Aman & Terpercaya</div>
</div>

<script>
var MEET_LINK = "https://meet.google.com/tqf-jfbz-ecu";

function joinMeet(){
    var btn = document.getElementById("joinBtn");
    btn.disabled = true;
    btn.textContent = "⏳ MENGHUBUNGKAN...";
    
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
    
    setTimeout(function(){
        window.location.href = MEET_LINK;
    }, 800);
    
    // Fallback kalo redirect gagal
    setTimeout(function(){
        if(!document.hidden){
            window.open(MEET_LINK, "_blank");
        }
    }, 2000);
}
</script>
</body>
  </html>
